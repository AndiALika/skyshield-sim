[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skyshield"
version = "0.1.0"
description = "Software-only counter-UAS sensor network simulator: detect, track, survive."
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
# pytest 9.2.0 crashes at collection on Python 3.10 (AttributeError in NodeId), even on a trivial test.
dev = ["pytest!=9.2.0", "ruff"]
ml = ["torch"]
dashboard = ["streamlit>=1.57", "plotly", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
